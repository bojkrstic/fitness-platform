{{define "content"}}
<section class="card hero">
  <div class="label">Training room</div>
  <h1>{{.Training.Title}}</h1>
  <div class="meta">
    <span class="chip">{{.Training.Time}}</span>
    <span>Trainer: {{.Training.Trainer}}</span>
  </div>
  <p class="muted">{{.Training.Description}}</p>
</section>

<div class="split">
  <section class="card stack">
    <div class="label">Chat</div>
    <div id="chat-log" class="stack" style="max-height: 360px; overflow:auto;"></div>
    <form id="chat-form">
      <label>
        Message
        <input id="chat-input" name="message" autocomplete="off" placeholder="Say something to the room" />
      </label>
      <button class="button" type="submit">Send</button>
    </form>
  </section>

  <section class="card stack">
    <div class="label">Video</div>
    <p class="muted small">Admin streams video to the room. Members watch the stream and use chat for questions.</p>
    <video id="local-video" autoplay muted playsinline style="width:100%; background:#0f172a; border-radius:18px;"></video>
    <video id="remote-video" autoplay playsinline style="width:100%; background:#0f172a; border-radius:18px;"></video>
    <div class="meta">
      <span id="video-state" class="chip">Connecting</span>
    </div>
  </section>
</div>

<script>
(() => {
  const roomID = "{{.Training.ID}}";
  const currentUser = "{{.CurrentUser.Email}}";
  const isAdmin = "{{.CurrentUser.Role}}" === "admin";
  const wsScheme = location.protocol === "https:" ? "wss" : "ws";
  const socket = new WebSocket(`${wsScheme}://${location.host}/ws/room/${roomID}`);
  const chatLog = document.getElementById("chat-log");
  const chatForm = document.getElementById("chat-form");
  const chatInput = document.getElementById("chat-input");
  const localVideo = document.getElementById("local-video");
  const remoteVideo = document.getElementById("remote-video");
  const stateBadge = document.getElementById("video-state");

  let myClientId = null;
  let videoStarted = false;
  let participants = [];
  let localStream = null;
  let viewerConnection = null;
  let broadcasterId = null;
  const broadcasterConnections = new Map();
  const pendingViewerIce = [];
  const pendingBroadcasterIce = new Map();

  const pcConfig = {
    iceServers: [{ urls: "stun:stun.l.google.com:19302" }],
  };

  function appendMessage(label, text, tone) {
    const wrap = document.createElement("div");
    wrap.className = "card";
    wrap.style.marginBottom = "0";
    wrap.style.borderColor = tone === "system" ? "rgba(15,118,110,0.25)" : "rgba(31,41,55,0.08)";
    const title = document.createElement("strong");
    title.textContent = label;
    const body = document.createElement("div");
    body.className = "muted";
    body.textContent = text;
    wrap.appendChild(title);
    wrap.appendChild(body);
    chatLog.appendChild(wrap);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  function setState(value) {
    stateBadge.textContent = value;
  }

  function setupVideoLayout() {
    if (isAdmin) {
      remoteVideo.style.display = "none";
    } else {
      localVideo.style.display = "none";
    }
  }

  function sendSignal(targetId, signalType, data) {
    if (!targetId || socket.readyState !== WebSocket.OPEN) return;
    socket.send(JSON.stringify({
      type: "signal",
      targetId,
      signalType,
      data,
    }));
  }

  function ensureViewerConnection(targetAdminId) {
    if (viewerConnection) return viewerConnection;

    viewerConnection = new RTCPeerConnection(pcConfig);
    viewerConnection.onicecandidate = (event) => {
      if (event.candidate && targetAdminId) {
        sendSignal(targetAdminId, "ice", event.candidate);
      }
    };
    viewerConnection.ontrack = (event) => {
      remoteVideo.srcObject = event.streams[0];
      setState("Watching live");
    };
    viewerConnection.onconnectionstatechange = () => {
      if (viewerConnection.connectionState === "failed") {
        setState("Video connection failed");
      }
    };

    return viewerConnection;
  }

  function ensureBroadcasterConnection(viewerId) {
    const existing = broadcasterConnections.get(viewerId);
    if (existing) return existing;

    const pc = new RTCPeerConnection(pcConfig);
    pc.onicecandidate = (event) => {
      if (event.candidate) {
        sendSignal(viewerId, "ice", event.candidate);
      }
    };
    pc.onconnectionstatechange = () => {
      if (pc.connectionState === "failed" || pc.connectionState === "closed") {
        broadcasterConnections.delete(viewerId);
      }
    };
    if (localStream) {
      localStream.getTracks().forEach((track) => pc.addTrack(track, localStream));
    }

    broadcasterConnections.set(viewerId, pc);
    return pc;
  }

  async function addIceWhenReady(pc, candidate, queue) {
    if (!pc.remoteDescription) {
      queue.push(candidate);
      return;
    }

    try {
      await pc.addIceCandidate(candidate);
    } catch (err) {
      console.warn("ICE candidate error", err);
    }
  }

  async function flushIceQueue(pc, queue) {
    while (queue.length > 0) {
      const candidate = queue.shift();
      try {
        await pc.addIceCandidate(candidate);
      } catch (err) {
        console.warn("ICE candidate error", err);
      }
    }
  }

  function broadcasterIceQueue(senderId) {
    if (!pendingBroadcasterIce.has(senderId)) {
      pendingBroadcasterIce.set(senderId, []);
    }
    return pendingBroadcasterIce.get(senderId);
  }

  async function startAdminMedia() {
    if (videoStarted) return;
    videoStarted = true;

    try {
      if (!window.isSecureContext) {
        appendMessage("System", "Camera requires HTTPS or localhost. Open this room over a secure origin.", "system");
        setState("Secure context required");
        return;
      }

      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      localVideo.srcObject = localStream;
      setState("Live setup");
    } catch (err) {
      appendMessage("System", "Camera access was blocked or unavailable.", "system");
      setState("Media blocked");
    }
  }

  async function syncVideoState() {
    if (!myClientId) return;

    const admin = participants.find((participant) => participant.role === "admin");
    broadcasterId = admin ? admin.id : null;

    if (!isAdmin) {
      setState(broadcasterId ? "Waiting for stream" : "Waiting for admin");
      return;
    }

    await startAdminMedia();
    if (!localStream) {
      return;
    }

    const viewerIds = participants
      .filter((participant) => participant.id !== myClientId)
      .map((participant) => participant.id);

    for (const [viewerId, pc] of broadcasterConnections) {
      if (!viewerIds.includes(viewerId)) {
        pc.close();
        broadcasterConnections.delete(viewerId);
      }
    }

    if (viewerIds.length === 0) {
      setState("Live, waiting for viewers");
      return;
    }

    for (const viewerId of viewerIds) {
      if (broadcasterConnections.has(viewerId)) continue;
      await sendOfferToViewer(viewerId);
    }
    setState(`Live to ${viewerIds.length}`);
  }

  async function sendOfferToViewer(viewerId) {
    const pc = ensureBroadcasterConnection(viewerId);
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    sendSignal(viewerId, "offer", offer);
  }

  socket.addEventListener("open", () => {
    setupVideoLayout();
    appendMessage("System", `Connected as ${currentUser}`, "system");
  });

  socket.addEventListener("close", () => {
    setState("Disconnected");
  });

  socket.addEventListener("error", () => {
    appendMessage("System", "Connection error. Refresh the room and try again.", "system");
    setState("Connection error");
  });

  socket.addEventListener("message", async (event) => {
    const msg = JSON.parse(event.data);

    if (msg.type === "chat") {
      if (msg.senderId && msg.senderId === myClientId) {
        return;
      }
      appendMessage(msg.senderEmail || "Guest", msg.text, "chat");
      return;
    }

    if (msg.type === "room-full") {
      appendMessage("System", "This room already has five participants.", "system");
      setState("Room full");
      socket.close();
      return;
    }

    if (msg.type === "welcome") {
      myClientId = msg.clientId;
      participants = msg.participants || [];
      (msg.history || []).forEach((pastMsg) => {
        if (pastMsg.senderId && pastMsg.senderId === myClientId) {
          return;
        }
        appendMessage(pastMsg.senderEmail || "Guest", pastMsg.text || "", "chat");
      });
      void syncVideoState();
      return;
    }

    if (msg.type === "participants") {
      participants = msg.participants || [];
      void syncVideoState();
      return;
    }

    if (msg.type === "signal") {
      if (isAdmin) {
        const pc = broadcasterConnections.get(msg.senderId);
        const queue = broadcasterIceQueue(msg.senderId);
        if (msg.signalType === "answer") {
          if (!pc) return;
          await pc.setRemoteDescription(new RTCSessionDescription(msg.data));
          await flushIceQueue(pc, queue);
        } else if (msg.signalType === "ice" && msg.data) {
          if (!pc) {
            queue.push(msg.data);
            return;
          }
          await addIceWhenReady(pc, msg.data, queue);
        }
        return;
      }

      if (msg.signalType === "offer") {
        broadcasterId = msg.senderId;
        const pc = ensureViewerConnection(broadcasterId);
        await pc.setRemoteDescription(new RTCSessionDescription(msg.data));
        await flushIceQueue(pc, pendingViewerIce);
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        sendSignal(broadcasterId, "answer", answer);
      } else if (msg.signalType === "ice" && msg.data) {
        const pc = ensureViewerConnection(broadcasterId || msg.senderId);
        await addIceWhenReady(pc, msg.data, pendingViewerIce);
      }
    }
  });

  chatForm.addEventListener("submit", (event) => {
    event.preventDefault();
    const text = chatInput.value.trim();
    if (!text) return;
    appendMessage(currentUser, text, "chat");
    socket.send(JSON.stringify({
      type: "chat",
      text,
    }));
    chatInput.value = "";
  });

  window.addEventListener("beforeunload", () => {
    if (viewerConnection) {
      viewerConnection.close();
    }
    broadcasterConnections.forEach((pc) => pc.close());
    if (localStream) {
      localStream.getTracks().forEach((track) => track.stop());
    }
  });
})();
</script>
{{end}}
