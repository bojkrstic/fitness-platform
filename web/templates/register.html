{{define "content"}}
<section class="card hero">
  <div class="label">Access</div>
  <h1>Create account</h1>
  <p class="muted">Register a member account to join training rooms.</p>
  <form method="post" action="/auth/register">
    <input type="hidden" name="next" value="{{.Next}}">
    <label>
      Email
      <input name="email" type="email" value="{{.Email}}" autocomplete="email" required>
    </label>
    <label>
      Password
      <input name="password" type="password" autocomplete="new-password" minlength="8" required>
    </label>
    <label>
      Confirm password
      <input name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
    </label>
    <button class="button" type="submit">Register</button>
  </form>
  <p class="small muted">Already have an account? <a href="/auth/login{{if .Next}}?next={{.Next}}{{end}}">Login here</a>.</p>
</section>
{{end}}
