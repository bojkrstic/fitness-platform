services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fitness
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness
    ports:
      - "5432:5432"
    volumes:
      - fitness_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness -d fitness"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://fitness:fitness@db:5432/fitness?sslmode=disable
      PORT: 8080
      SEED_ADMIN_EMAIL: admin@fitness.local
      SEED_ADMIN_PASSWORD: Admin123!
    ports:
      - "8080:8080"

volumes:
  fitness_pgdata:
