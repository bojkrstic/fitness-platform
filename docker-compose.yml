services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fitness
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness
    ports:
      - "5433:5432"
    volumes:
      - fitness_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness -d fitness"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      turn:
        condition: service_started
    environment:
      DATABASE_URL: postgres://fitness:fitness@db:5432/fitness?sslmode=disable
      PORT: 8080
      SEED_ADMIN_EMAIL: admin@fitness.local
      SEED_ADMIN_PASSWORD: Admin123!
      WEBRTC_ICE_SERVERS: ${WEBRTC_ICE_SERVERS:-}
      WEBRTC_TURN_HOST: ${WEBRTC_TURN_HOST:-localhost}
      WEBRTC_TURN_PORT: ${WEBRTC_TURN_PORT:-3478}
      WEBRTC_TURN_USERNAME: ${WEBRTC_TURN_USERNAME:-fitness}
      WEBRTC_TURN_PASSWORD: ${WEBRTC_TURN_PASSWORD:-change-this-turn-password}
    ports:
      - "8020:8080"

  turn:
    image: coturn/coturn:4.6-alpine
    environment:
      WEBRTC_TURN_EXTERNAL_IP: ${WEBRTC_TURN_EXTERNAL_IP:-127.0.0.1}
      WEBRTC_TURN_PORT: ${WEBRTC_TURN_PORT:-3478}
      WEBRTC_TURN_USERNAME: ${WEBRTC_TURN_USERNAME:-fitness}
      WEBRTC_TURN_PASSWORD: ${WEBRTC_TURN_PASSWORD:-change-this-turn-password}
      WEBRTC_TURN_REALM: ${WEBRTC_TURN_REALM:-fitness-platform}
    entrypoint: ["turnserver"]
    command:
      - -n
      - --log-file=stdout
      - --lt-cred-mech
      - --fingerprint
      - --no-cli
      - --no-tls
      - --no-dtls
      - --realm=${WEBRTC_TURN_REALM:-fitness-platform}
      - --listening-port=${WEBRTC_TURN_PORT:-3478}
      - --user=${WEBRTC_TURN_USERNAME:-fitness}:${WEBRTC_TURN_PASSWORD:-change-this-turn-password}
      - --external-ip=${WEBRTC_TURN_EXTERNAL_IP:-127.0.0.1}
      - --min-port=49160
      - --max-port=49200
    ports:
      - "${WEBRTC_TURN_PORT:-3478}:${WEBRTC_TURN_PORT:-3478}/tcp"
      - "${WEBRTC_TURN_PORT:-3478}:${WEBRTC_TURN_PORT:-3478}/udp"
      - "49160-49200:49160-49200/udp"

volumes:
  fitness_pgdata:
